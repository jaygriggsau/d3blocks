<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>d3blocks — 3D CAD</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <div class="panel">
      <h1>d3blocks</h1>
      <p class="hint">
        <b>V</b> Select · <b>B</b> Place · <b>K</b> Sketch · <b>W/E/R</b> Move/Rotate/Scale · <b>Del</b> delete · <b>Ctrl+D</b> duplicate · <b>Ctrl+Z/Y</b> undo/redo
      </p>

      <div class="row col">
        <label>Tool</label>
        <div id="tools">
          <div class="tool" data-tool="select">Select</div>
          <div class="tool" data-tool="place">Place</div>
          <div class="tool" data-tool="sketch">Sketch</div>
        </div>
      </div>

      <div class="row col hidden" id="sketchRow">
        <label>Sketch</label>
        <div id="sketchTools">
          <div class="tool" data-stool="rect">Rect</div>
          <div class="tool" data-stool="circle">Circle</div>
          <div class="tool" data-stool="poly">Polyline</div>
        </div>
        <div class="sub-row">
          <label class="inline">Height</label>
          <input type="number" id="extrudeHeight" value="1" min="0.1" step="0.1" />
          <button id="extrudeBtn" disabled>Extrude</button>
        </div>
        <div class="sub-row">
          <button id="finishPoly">Close</button>
          <button id="cancelSketch">Cancel</button>
        </div>
        <p class="hint sub">Click to add points · Double-click or <b>Enter</b> to close polyline · <b>Esc</b> cancels</p>
      </div>

      <div class="row col" id="transformRow">
        <label>Transform</label>
        <div id="transformModes">
          <div class="tool" data-mode="translate">Move</div>
          <div class="tool" data-mode="rotate">Rotate</div>
          <div class="tool" data-mode="scale">Scale</div>
        </div>
      </div>

      <div class="row col">
        <label>Shape</label>
        <div id="shapes"></div>
      </div>

      <div class="row">
        <label>Color</label>
        <div id="palette"></div>
      </div>

      <div class="row">
        <label for="picker">Custom</label>
        <input type="color" id="picker" value="#5ec8ff" />
      </div>

      <div class="row checkboxes">
        <label class="check"><input type="checkbox" id="snap" checked /> Snap to grid</label>
      </div>

      <div class="row buttons">
        <button id="save">Save</button>
        <button id="load">Load</button>
        <button id="clear">Clear</button>
      </div>

      <div class="row buttons">
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
        <button id="duplicate">Duplicate</button>
        <button id="deleteBtn">Delete</button>
      </div>

      <div class="row buttons">
        <button id="export">JSON</button>
        <button id="exportStl">Export STL</button>
        <button id="screenshot">PNG</button>
      </div>

      <div class="row buttons">
        <button id="toggleGrid">Toggle Grid</button>
      </div>

      <p class="count"><span id="blockCount">0</span> objects · <span id="selCount">0</span> selected</p>
    </div>
  </div>

  <canvas id="scene"></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
